---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 10.0.0.11
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
  imagePullPolicy: IfNotPresent
  name: lenovo
  taints: []
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: 1.37.1
clusterName: homelab-cluster
controlPlaneEndpoint: "10.0.0.201:6443"
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  dnsDomain: cluster.local
proxy:
  disabled: true # Cilium eBPF handles all service routing
apiServer:
  extraArgs:
    # Entra ID authentication
    - name: "oidc-issuer-url"
      value: "https://login.microsoftonline.com/c8e5d5f1-237a-45a1-a913-5908b6042e39/v2.0"
    - name: "oidc-client-id"
      value: "b3ca90cf-82eb-48fe-8f41-bf5ace125bdf"
    - name: "oidc-username-claim"
      value: "preferred_username"
    - name: "oidc-groups-claim"
      value: "groups"
etcd:
  local:
    dataDir: /var/lib/etcd
