---
name: Deploy Documentation

"on":
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Ensure mkdocs plugins are installed
        run: pipx inject mkdocs-material mkdocs-panzoom-plugin 2>/dev/null || true

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
