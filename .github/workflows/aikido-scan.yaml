name: Aikido Local Image Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    name: Scan local Docker images
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan all local images with Aikido
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          FAILED=0
          # Define the path for the persistent state file on the runner
          STATE_FILE="$HOME/.aikido_scanned_images"
          touch "$STATE_FILE"

          # Get all images (ID and Name:Tag) except those tagged <none>, and save to a temporary file
          docker images --format '{{.ID}} {{.Repository}}:{{.Tag}}' | grep -v "<none>" | sort -u > current_images.txt

          # Iterate through each image listed in the temporary file
          while read -r image_id image_name; do
            # Check if the Image ID already exists in the state file
            if grep -q "^$image_id$" "$STATE_FILE"; then
              echo "Skipping already scanned image: $image_name ($image_id)"
              continue
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Scanning: $image_name ($image_id)"

            # Run the Aikido scanner
            if /usr/local/bin/aikido-local-scanner image-scan "$image_name" \
              --apikey "$AIKIDO_API_KEY" \
              --fail-on critical; then

              # If scan succeeds, append the Image ID to the state file
              echo "$image_id" >> "$STATE_FILE"
            else
              # If scan fails, mark the job as failed but continue scanning other images
              FAILED=1
            fi
          done < current_images.txt

          # Clean up the temporary file
          rm current_images.txt

          # Exit with the combined failure status
          exit $FAILED
