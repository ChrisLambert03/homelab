name: Aikido Local Image Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    name: Scan local Docker images
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan all homelab images with Aikido
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
          INVENTORY_CONTENT: ${{ secrets.INVENTORY }}
        run: |
          echo "$INVENTORY_CONTENT" > inventory.ini
          chmod +x scripts/aikido-multi-scan.sh
          ./scripts/aikido-multi-scan.sh inventory.ini "$AIKIDO_API_KEY"
