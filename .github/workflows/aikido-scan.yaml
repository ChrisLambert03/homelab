name: Aikido Local Image Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    name: Scan local Docker images
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan all local images with Aikido
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          FAILED=0
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep -v "<none>" \
            | sort -u)

          for image in $IMAGES; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Scanning: $image"
            /usr/local/bin/aikido-local-scanner image-scan "$image" \
              --apikey "$AIKIDO_API_KEY" \
              --fail-on critical || FAILED=1
          done

          exit $FAILED
