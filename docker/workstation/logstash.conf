# Logstash Configuration for Homelab
# This pipeline handles logs from both the Docker GELF driver and Filebeat shippers.

input {
  # Listen for logs from Docker containers using the GELF logging driver
  gelf {
    port => 12201
    host => "0.0.0.0"
    type => "docker"
  }
  
  # Listen for logs from Filebeat (used for apps that write to files instead of stdout)
  beats {
    port => 5044
  }
}

filter {
  # --- STEP 1: Host Normalization ---
  # Recent Beats versions send 'host' as an object, which conflicts with Elasticsearch's 
  # expected string mapping. We flatten it here to avoid indexing failures.
  if [host] and [host][name] {
    mutate {
      add_field => { "temp_host" => "%{[host][name]}" }
      remove_field => [ "host" ]
    }
    mutate { rename => { "temp_host" => "host" } }
  }

  # --- STEP 2: Service Name Mirroring ---
  # Docker GELF logs use 'container_name', while Filebeat uses 'service'.
  # We mirror these fields so Kibana views and filters work regardless of the source.
  if [service] and ![container_name] {
    mutate { add_field => { "container_name" => "%{service}" } }
  }
  if [container_name] and ![service] {
    mutate { add_field => { "service" => "%{container_name}" } }
  }

  # --- STEP 3: Nginx Proxy Manager Parsing ---
  # Parses the custom access log format into structured fields like client_ip, status, and domain.
  if [service] == "nginx-proxy-manager" {
    grok {
      match => { "message" => "\[%{HTTPDATE:timestamp}\] - %{NUMBER:status:int} %{NUMBER:upstream_status} - %{WORD:method} %{WORD:protocol} %{HOSTNAME:domain} \"%{NOTSPACE:path}\" \[Client %{IPORHOST:client_ip}\] \[Length %{NUMBER:length}\] \[Gzip %{NOTSPACE:gzip}\] \[Sent-to %{IPORHOST:upstream_ip}\] \"%{DATA:user_agent}\" \"%{DATA:referrer}\"" }
    }
  }

  # --- STEP 4: *Arr Suite Parsing (Sonarr, Radarr, Prowlarr) ---
  # Parses the pipeline-delimited log format used by the *Arr stack.
  # Extracts: timestamp, log_level (Info/Warn/Error), component, and the message.
  if [service] in ["sonarr", "radarr", "prowlarr"] {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\|%{LOGLEVEL:log_level}\|%{DATA:component}\|%{GREEDYDATA:log_message}" }
    }
  }

  # --- STEP 5: Automated JSON Parsing ---
  # If a log message is a JSON string, automatically parse it into a 'data' object.
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "data"
    }
  }
  
  # Record the absolute time Logstash received the event (useful for debugging ingestion delays)
  mutate {
    add_field => { "received_at" => "%{@timestamp}" }
  }
}

output {
  # Send all processed logs to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    # Daily indices for better management and retention policies
    index => "homelab-logs-%{+YYYY.MM.dd}"
  }
}
