---
- name: Deploy TLS Certs to Docker Hosts
  hosts: docker_hosts
  become: true
  vars:
    ca_dir: "/home/ansible/homelab-certs"
    docker_cert_dir: "/etc/docker/certs"

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

  tasks:
    - name: Create Docker cert directory
      ansible.builtin.file:
        path: "{{ docker_cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy CA cert
      ansible.builtin.copy:
        src: "{{ ca_dir }}/ca.pem"
        dest: "{{ docker_cert_dir }}/ca.pem"
        owner: root
        group: root
        mode: "0444"
      notify: Restart Docker

    - name: Copy server cert
      ansible.builtin.copy:
        src: "{{ ca_dir }}/{{ inventory_hostname }}-server-cert.pem"
        dest: "{{ docker_cert_dir }}/server-cert.pem"
        owner: root
        group: root
        mode: "0444"
      notify: Restart Docker

    - name: Copy server key
      ansible.builtin.copy:
        src: "{{ ca_dir }}/{{ inventory_hostname }}-server-key.pem"
        dest: "{{ docker_cert_dir }}/server-key.pem"
        owner: root
        group: root
        mode: "0400"
      notify: Restart Docker
