---
- name: Configure Docker TLS and GELF logging
  hosts: docker_hosts
  become: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

  tasks:
    - name: Template Docker daemon.json
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart Docker

    - name: Create systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    - name: Copy systemd override.conf
      ansible.builtin.copy:
        src: override.conf
        dest: /etc/systemd/system/docker.service.d/override.conf
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Docker
