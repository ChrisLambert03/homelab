---
- name: Homelab Monitoring & Diagnostics
  hosts: all
  become: true
  tasks:
    - name: Install all the things
      ansible.builtin.apt:
        name:
          - iperf3  # Network speed
          - powerstat  # Wattage/Power
          - htop  # Standard monitor
          - lm-sensors  # Temps
          - nload  # Network bandwidth graph
          - fzf  # Fuzzy search for history/files
          - usbutils  # lsusb
          - pciutils  # lspci
          - iotop  # Per-process disk I/O monitoring
          - nmap  # Network scanning
          - btop  # Better htop
          - ncdu  # Disk Usage analyzer
          - unzip  # For extracting zip files
          - cri-tools  # crictl for Kubernetes/containerd debugging & image pruning
          - etcd-client  # etcdctl CLI for etcd cluster management
        state: present
        update_cache: true

    - name: Install fastfetch on modern releases
      ansible.builtin.apt:
        name: fastfetch
        state: present
      when: ansible_facts['distribution_release'] != 'noble'
