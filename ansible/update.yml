---
- name: Simple Homelab Update
  hosts: all
  become: true
  tasks:
    - name: Update cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Cleanup unused packages and config files
      ansible.builtin.apt:
        autoremove: true
        purge: true
