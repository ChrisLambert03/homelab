- name: Generate TLS Certs for Docker Hosts
  hosts: localhost
  become: yes
  vars:
    ca_dir: "/home/ansible/homelab-certs" # Where all certs will be stored locally
    cert_expiry: "+1d" # Override at runtime: -e "cert_expiry=+1h" ;   # Change to +1h, +30d, +3650d etc.
    hosts_to_cert: # Must match inventory hostnames exactly
      - workstation
      - lenovo
      - opti74
      - optiplex

  tasks:
    - name: Create cert directory
      ansible.builtin.file:
        path: "{{ ca_dir }}"
        state: directory
        mode: "0700"

    # --- CA ---
    # The CA is the root of trust. Everything is signed by this.
    - name: Generate CA private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/ca.key"
        force: yes

    - name: Generate CA certificate
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/ca.crt"
        privatekey_path: "{{ ca_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "{{ cert_expiry }}"

    # --- Server Certs ---
    # One key/cert pair per host, signed by the CA above
    - name: Generate server private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/{{ item }}-server.key"
        force: yes
      loop: "{{ hosts_to_cert }}"

    - name: Generate server CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/{{ item }}-server.csr"
        privatekey_path: "{{ ca_dir }}/{{ item }}-server.key"
        common_name: "{{ item }}"
        subject_alt_name:
          - "DNS:{{ item }}" # Tailscale hostname
          - "IP:{{ hostvars[item]['ansible_host'] }}" # Tailscale IP from inventory
      loop: "{{ hosts_to_cert }}"

    - name: Sign server cert with CA
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/{{ item }}-server.crt"
        csr_path: "{{ ca_dir }}/{{ item }}-server.csr"
        ownca_path: "{{ ca_dir }}/ca.crt"
        ownca_privatekey_path: "{{ ca_dir }}/ca.key"
        provider: ownca
        ownca_not_after: "{{ cert_expiry }}"
      loop: "{{ hosts_to_cert }}"

    # --- Client Cert ---
    # One shared client cert, used from your machine to talk to Docker
    - name: Generate client private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/client.key"
        force: yes

    - name: Generate client CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/client.csr"
        privatekey_path: "{{ ca_dir }}/client.key"
        common_name: "docker-client"
        extended_key_usage:
          - clientAuth # Tells Docker this cert is for client auth only

    - name: Sign client cert with CA
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/client.crt"
        csr_path: "{{ ca_dir }}/client.csr"
        ownca_path: "{{ ca_dir }}/ca.crt"
        ownca_privatekey_path: "{{ ca_dir }}/ca.key"
        provider: ownca
        ownca_not_after: "{{ cert_expiry }}"
