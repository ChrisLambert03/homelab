---
# ------------------------------------------------------------------------------
# Playbook: Generate TLS Certs for Docker Hosts
# Purpose:  Creates a local Certificate Authority (CA) and issues server/client
#           certificates for securing Docker daemon communication via TLS.
# ------------------------------------------------------------------------------

- name: Generate TLS Certs for Docker Hosts
  hosts: localhost
  gather_facts: false
  become: true

  vars:
    # Directory where all certificates and keys will be stored locally
    ca_dir: "/home/ansible/homelab-certs"
    # Duration for CA validity (10 years)
    ca_expiry: "+3650d"
    # Duration for individual certificates (1 year)
    cert_expiry: "+365d"
    # List of hostnames that require server certificates
    hosts_to_cert:
      - workstation
      - lenovo
      - opti74
      - optiplex
      - opti76

  tasks:
    # ─── Preparation ──────────────────────────────────────────────────────────

    - name: Create cert directory
      ansible.builtin.file:
        path: "{{ ca_dir }}"
        state: directory
        mode: "0700"
        owner: ansible
        group: ansible

    - name: Check if CA certificate already exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/ca.pem"
      register: ca_stat

    - name: Check if client certificate already exists
      ansible.builtin.stat:
        path: "{{ ca_dir }}/client-cert.pem"
      register: client_stat

    # ─── Certificate Authority (CA) Creation ──────────────────────────────────
    # Only runs if CA does not exist on disk

    - name: Generate CA private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/ca-key.pem"
        mode: "0600"
        force: false
      when: not ca_stat.stat.exists

    - name: Generate CA CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/ca.csr"
        privatekey_path: "{{ ca_dir }}/ca-key.pem"
        common_name: "Docker Homelab CA"
        basic_constraints: ["CA:TRUE"]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
        force: false
      when: not ca_stat.stat.exists

    - name: Generate CA certificate
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/ca.pem"
        csr_path: "{{ ca_dir }}/ca.csr"
        privatekey_path: "{{ ca_dir }}/ca-key.pem"
        provider: selfsigned
        selfsigned_not_after: "{{ ca_expiry }}"
        force: false
      when: not ca_stat.stat.exists

    # ─── Server Certificate Generation ────────────────────────────────────────
    # Loops through 'hosts_to_cert' and only creates certificates for nodes that lack one.

    - name: Check which server certificates exist
      ansible.builtin.stat:
        path: "{{ ca_dir }}/{{ item }}-server-cert.pem"
      loop: "{{ hosts_to_cert }}"
      register: server_cert_stats

    - name: Build list of missing server cert hosts
      ansible.builtin.set_fact:
        missing_cert_hosts: "{{ server_cert_stats.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | list }}"

    - name: Generate server private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/{{ item }}-server-key.pem"
        mode: "0600"
        force: false
      loop: "{{ missing_cert_hosts }}"

    - name: Generate server CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/{{ item }}-server.csr"
        privatekey_path: "{{ ca_dir }}/{{ item }}-server-key.pem"
        common_name: "{{ item }}"
        key_usage: [digitalSignature, keyEncipherment]
        extended_key_usage: [serverAuth]
        subject_alt_name:
          - "DNS:{{ item }}"
          - "DNS:localhost"
          - "IP:127.0.0.1"
          - "IP:{{ hostvars[item]['ansible_host'] | default('127.0.0.1') }}"
        force: false
      loop: "{{ missing_cert_hosts }}"

    - name: Sign server cert with CA
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/{{ item }}-server-cert.pem"
        csr_path: "{{ ca_dir }}/{{ item }}-server.csr"
        ownca_path: "{{ ca_dir }}/ca.pem"
        ownca_privatekey_path: "{{ ca_dir }}/ca-key.pem"
        provider: ownca
        ownca_not_after: "{{ cert_expiry }}"
        force: false
      loop: "{{ missing_cert_hosts }}"

    # ─── Client Certificate Generation ────────────────────────────────────────
    # Generates client certificate only if missing

    - name: Generate client private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/client-key.pem"
        mode: "0600"
        force: false
      when: not client_stat.stat.exists

    - name: Generate client CSR
      community.crypto.openssl_csr:
        path: "{{ ca_dir }}/client.csr"
        privatekey_path: "{{ ca_dir }}/client-key.pem"
        common_name: "docker-client"
        key_usage: [digitalSignature]
        extended_key_usage: [clientAuth]
        force: false
      when: not client_stat.stat.exists

    - name: Sign client cert with CA
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/client-cert.pem"
        csr_path: "{{ ca_dir }}/client.csr"
        ownca_path: "{{ ca_dir }}/ca.pem"
        ownca_privatekey_path: "{{ ca_dir }}/ca-key.pem"
        provider: ownca
        ownca_not_after: "{{ cert_expiry }}"
        force: false
      when: not client_stat.stat.exists

    # ─── Final Permissions ────────────────────────────────────────────────────

    - name: Set ownership of cert directory
      ansible.builtin.file:
        path: "{{ ca_dir }}"
        owner: ansible
        group: ansible
        recurse: true
      become: true
