---
- name: Configure Docker TLS
  hosts: docker_hosts
  become: true
  vars:
    docker_cert_dir: "/etc/docker/certs"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

  tasks:
    - name: Configure Docker daemon for TLS
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "tlsverify": true,
            "tlscacert": "{{ docker_cert_dir }}/ca.pem",
            "tlscert": "{{ docker_cert_dir }}/server-cert.pem",
            "tlskey": "{{ docker_cert_dir }}/server-key.pem",
            "hosts": ["unix:///var/run/docker.sock", "tcp://0.0.0.0:2376"]
          }
      notify: Restart Docker

    - name: Create systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    - name: Override systemd ExecStart to remove -H flag
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd --containerd=/run/containerd/containerd.sock
      notify:
        - Reload systemd
        - Restart Docker
