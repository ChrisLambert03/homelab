---
- name: Configure Docker TLS
  hosts: docker_hosts
  vars:
    docker_cert_dir: "/etc/docker/certs"

  tasks:
    - name: Configure Docker daemon for TLS
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644" # Root writes, everyone reads
        content: |
          {
            "tls": true,
            "tlsverify": true,
            "tlscacert": "{{ docker_cert_dir }}/ca.crt",
            "tlscert": "{{ docker_cert_dir }}/server.crt",
            "tlskey": "{{ docker_cert_dir }}/server.key",
            "hosts": ["unix:///var/run/docker.sock", "tcp://0.0.0.0:2376"]
            # Unix socket for local, TCP for remote TLS
          }
      become: true

    - name: Restart Docker
      # Pick up the new daemon.json config
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: true # Tells systemd to re-read unit files
      become: true
