# Sonarr Service Manifest
# Exposes Sonarr internally within the cluster and externally via NodePort.
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: default
spec:
  # Using NodePort to bind the service to a static port on all Kubernetes nodes.
  # This allows Nginx Proxy Manager (running externally) to route traffic to Sonarr.
  type: NodePort
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
      # NPM forwards traffic from sonarr.lambertlab.us to this port
      nodePort: 32089
