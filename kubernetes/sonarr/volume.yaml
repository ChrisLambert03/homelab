# Sonarr iSCSI Configuration Volume Manifest
# Provisions a PersistentVolume (PV) pointing directly to a dedicated iSCSI Target
# on the Terramaster NAS, and binds it to a PersistentVolumeClaim (PVC).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-iscsi-pv
spec:
  capacity:
    # Matches the exact 20 GB LUN created on the Terramaster NAS
    storage: 20G
  volumeMode: Filesystem
  # ReadWriteOnce is required because iSCSI targets can only be mounted by one node at a time
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  iscsi:
    targetPortal: 10.0.0.60:3260
    # Dedicated iSCSI target for Sonarr config on the NAS
    iqn: iqn.2026-06.us.lambertlab:sonarr-config
    # 1 target per LUN layout, meaning the LUN index is always 0
    lun: 0
    fsType: ext4
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-iscsi-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  # Explicitly bind to the PV created above
  volumeName: sonarr-iscsi-pv
  resources:
    requests:
      storage: 20G
  # Empty string storageClassName disables dynamic provisioning and enforces static binding
  storageClassName: ""
