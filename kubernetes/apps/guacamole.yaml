---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guacamole
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    # 1. Local Homelab Git Repo (defines $homelab alias and companion manifests)
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      ref: homelab
      path: kubernetes/guacamole
      directory:
        exclude: 'values.yaml'

    # 2. Upstream HelmForge Guacamole Chart
    - repoURL: https://repo.helmforge.dev
      chart: guacamole
      targetRevision: 1.5.2
      helm:
        releaseName: guacamole
        valueFiles:
          - $homelab/kubernetes/guacamole/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: guacamole
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
