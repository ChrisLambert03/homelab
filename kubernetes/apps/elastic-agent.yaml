---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    # 1. Git Repo (defines $homelab alias and companion manifests)
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      ref: homelab
      path: kubernetes/elastic-agent
      directory:
        exclude: 'values.yaml'

    # 2. Upstream Elastic Helm Chart using $homelab values.yaml
    - repoURL: https://helm.elastic.co
      chart: elastic-agent
      targetRevision: 9.5.4
      helm:
        releaseName: elastic-agent
        valueFiles:
          - $homelab/kubernetes/elastic-agent/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
