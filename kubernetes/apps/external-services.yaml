---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/external-services/cockpit
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/external-services/code
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/external-services/firefox
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/observability/kibana
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/storage/nas
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/external-services/pihole
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/infrastructure/external-services/portainer
#    - repoURL: git@github.com:ChrisLambert03/homelab.git
#      targetRevision: main
#      path: kubernetes/infrastructure/external-services/redisinsight
#    - repoURL: git@github.com:ChrisLambert03/homelab.git
#      targetRevision: main
#      path: kubernetes/gaming/retroarch
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      path: kubernetes/media/tdarr
  destination:
    server: https://kubernetes.default.svc
    namespace: external
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
