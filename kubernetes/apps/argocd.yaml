---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    # 1. Your Git Repo (defines $homelab alias and companion manifests, excludes values.yaml)
    - repoURL: git@github.com:ChrisLambert03/homelab.git
      targetRevision: main
      ref: homelab
      path: kubernetes/argocd
      directory:
        exclude: 'values.yaml'

    # 2. Upstream Argo CD Helm Chart using $homelab values.yaml
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.3.3
      helm:
        releaseName: argocd
        valueFiles:
          - $homelab/kubernetes/argocd/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
