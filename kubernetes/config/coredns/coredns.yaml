---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        hosts {
            10.0.0.11 lenovo.lan lenovo
            10.0.0.12 optiplex.lan optiplex
            10.0.0.13 opti74.lan opti74
            10.0.0.14 workstation.lan workstation
            10.0.0.60 nas.lan nas
            100.124.184.120 pihole.lan pihole.tailnet pihole-optiplex
            fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
            max_concurrent 1000
        }
        cache 30 {
            disable success cluster.local
            disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    ad.lambertlab.us:53 {
        errors
        cache 30
        forward . 10.10.0.10 {
            max_fails 2
            health_check 5s
        }
        reload
    }
