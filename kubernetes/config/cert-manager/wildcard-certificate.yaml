---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudflare-wildcard-certificate
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: lambertlab-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "lambertlab.us"
    - "*.lambertlab.us"
