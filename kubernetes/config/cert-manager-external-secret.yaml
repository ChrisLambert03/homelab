---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-cloudflare-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-token: "{{ .cert_manager_cloudflare_api_token }}"
  data:
    - secretKey: cert_manager_cloudflare_api_token
      remoteRef:
        key: secret/data/homelab
        property: cert_manager_cloudflare_api_token
