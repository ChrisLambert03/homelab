---
# Radarr Deployment Manifest
# Deploys Radarr inside the Kubernetes cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: default
  labels:
    app: radarr
spec:
  # Single replica deployment
  replicas: 1
  revisionHistoryLimit: 3
  # Strategy MUST be Recreate because the configuration volume uses iSCSI (ReadWriteOnce).
  # A rolling update would hang because the new pod cannot mount the iSCSI target
  # while the old pod is still running and holding the session lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          # Using LinuxServer community image
          image: lscr.io/linuxserver/radarr:latest
          env:
            # Set user and group IDs to prevent permission conflicts on storage mounts
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 7878
              name: http
          # Health check to ensure K3s restarts the pod if the database locks up (e.g. iSCSI disconnect)
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            # Persistent config directory mapped to iSCSI target on NAS
            - name: config
              mountPath: /config
            # Shared media directory mapped to NFS volume on NAS
            - name: media
              mountPath: /media
            # Map host timezone files read-only to ensure synchronized system logs
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        # Dedicated iSCSI Config LUN on the Terramaster NAS
        - name: config
          persistentVolumeClaim:
            claimName: radarr-iscsi-pvc
        # Unified NFS Media Storage on the Terramaster NAS (shared with Sonarr)
        - name: media
          persistentVolumeClaim:
            claimName: nas-media-pvc
        # Timezone host mount
        - name: localtime
          hostPath:
            path: /etc/localtime
