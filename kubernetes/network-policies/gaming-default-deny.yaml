---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gaming-default-deny
  namespace: gaming
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 8211
        - protocol: TCP
          port: 25575
        - protocol: TCP
          port: 8212
