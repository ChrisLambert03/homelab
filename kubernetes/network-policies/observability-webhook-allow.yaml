---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-webhook-allow
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elastic-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
