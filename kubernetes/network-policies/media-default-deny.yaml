---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-default-deny
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow intra-namespace traffic
    - from:
        - podSelector: {}
    # Allow Traefik ingress (kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
