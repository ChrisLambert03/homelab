apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: default
spec:
  ports:
    - port: 8096
      targetPort: 8096
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin
  namespace: default
  labels:
    kubernetes.io/service-name: jellyfin
addressType: IPv4
ports:
  - port: 8096
endpoints:
  - addresses:
      - "10.0.0.250"
