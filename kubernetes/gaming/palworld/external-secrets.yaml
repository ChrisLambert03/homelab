---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: palworld-secret
  namespace: gaming
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: palworld-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SERVER_PASSWORD: "{{ .palworld_server_password }}"
        ADMIN_PASSWORD: "{{ .palworld_admin_password }}"
  data:
    - secretKey: palworld_server_password
      remoteRef:
        key: secret/data/homelab
        property: palworld_server_password
    - secretKey: palworld_admin_password
      remoteRef:
        key: secret/data/homelab
        property: palworld_admin_password
