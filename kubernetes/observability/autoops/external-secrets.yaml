---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autoops-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: autoops-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        autoops-token: "{{ .autoops_token }}"
        temp-resource-id: "{{ .autoops_temp_resource_id }}"
        autoops-otel-url: "{{ .autoops_otel_url }}"
        autoops-es-url: "https://es.lambertlab.us"
        es-username: "{{ .es_username }}"
        es-password: "{{ .es_password }}"
        cloud-connected-mode-api-key: "{{ .elastic_cloud_connected_mode_api_key }}"
  data:
    - secretKey: autoops_token
      remoteRef:
        key: secret/data/autoops
        property: autoops_token
    - secretKey: autoops_temp_resource_id
      remoteRef:
        key: secret/data/autoops
        property: autoops_temp_resource_id
    - secretKey: autoops_otel_url
      remoteRef:
        key: secret/data/autoops
        property: autoops_otel_url
    - secretKey: es_username
      remoteRef:
        key: secret/data/autoops
        property: es_username
    - secretKey: es_password
      remoteRef:
        key: secret/data/autoops
        property: es_password
    - secretKey: elastic_cloud_connected_mode_api_key
      remoteRef:
        key: secret/data/autoops
        property: elastic_cloud_connected_mode_api_key
