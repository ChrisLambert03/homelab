---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: homarr-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        encryption-key: "{{ .homarr_secret_key }}"
  data:
    - secretKey: homarr_secret_key
      remoteRef:
        key: secret/data/homelab
        property: homarr_secret_key
