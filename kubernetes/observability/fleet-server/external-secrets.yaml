---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-server-agent-envvars
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: fleet-server-agent-envvars
    creationPolicy: Merge
    template:
      metadata:
        labels:
          agent.k8s.elastic.co/name: fleet-server
          common.k8s.elastic.co/type: agent
          eck.k8s.elastic.co/credentials: "true"
          eck.k8s.elastic.co/watched: "true"
      engineVersion: v2
      data:
        FLEET_ENROLLMENT_TOKEN: "{{ .fleet_server_enrollment_token }}"
        FLEET_SERVER_SERVICE_TOKEN: "{{ .fleet_server_service_token }}"
  data:
    - secretKey: fleet_server_enrollment_token
      remoteRef:
        key: secret/data/homelab
        property: fleet_server_enrollment_token
    - secretKey: fleet_server_service_token
      remoteRef:
        key: secret/data/homelab
        property: fleet_server_service_token
