---
apiVersion: v1
kind: Service
metadata:
  name: fleet-server-agent-http-service
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: observability-insecure-transport@kubernetescrd
spec:
  type: ClusterIP
  selector:
    agent.k8s.elastic.co/name: fleet-server
    common.k8s.elastic.co/type: agent
  ports:
    - name: https
      port: 8220
      protocol: TCP
      targetPort: 8220
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-server-ingress
  namespace: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: fleet.lambertlab.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleet-server-agent-http-service
                port:
                  number: 8220
