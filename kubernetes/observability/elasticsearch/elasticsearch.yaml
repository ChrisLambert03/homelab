---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: observability
spec:
  version: 9.3.2
  http:
    tls:
      selfSignedCertificate:
        disabled: false
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        path.repo:
          - /mnt/snapshots
        xpack.security.authc.api_key.enabled: true
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: elasticsearch
        spec:
          nodeSelector:
            kubernetes.io/hostname: workstation
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms16g -Xmx16g"
              resources:
                requests:
                  memory: 16Gi
                  cpu: "2"
                limits:
                  memory: 20Gi
                  cpu: "8"
              volumeMounts:
                - name: snapshot-dir
                  mountPath: /mnt/snapshots
          volumes:
            - name: snapshot-dir
              hostPath:
                path: /home/chris/services/elasticsearch/snapshots
                type: DirectoryOrCreate
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            resources:
              requests:
                storage: 100Gi
