---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kibana-secure-settings
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kibana-secure-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        xpack.security.encryptionKey: "{{ .kibana_secret_key }}"
        xpack.encryptedSavedObjects.encryptionKey: "{{ .kibana_secret_key }}"
        xpack.reporting.encryptionKey: "{{ .kibana_secret_key }}"
  data:
    - secretKey: kibana_secret_key
      remoteRef:
        key: secret/data/homelab
        property: kibana_secret_key
