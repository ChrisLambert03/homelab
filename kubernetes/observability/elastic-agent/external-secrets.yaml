---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elastic-agent-token
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: elastic-agent-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .fleet_enrollment_token }}"
  data:
    - secretKey: fleet_enrollment_token
      remoteRef:
        key: secret/data/homelab
        property: fleet_enrollment_token
