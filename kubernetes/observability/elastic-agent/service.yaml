---
apiVersion: v1
kind: Service
metadata:
  name: elastic-agent-syslog
  namespace: kube-system
  labels:
    app.kubernetes.io/name: elastic-agent
  annotations:
    lbipam.cilium.io/ips: "10.0.0.210"
spec:
  type: LoadBalancer
  selector:
    name: agent-pernode-elastic-agent
  ports:
    - name: syslog-udp
      port: 5514
      targetPort: 5514
      protocol: UDP
    - name: syslog-tcp
      port: 5514
      targetPort: 5514
      protocol: TCP
