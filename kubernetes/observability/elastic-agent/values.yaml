---
agent:
  image:
    tag: "9.3.2"
  fleet:
    enabled: true
    url: "https://fleet-server-agent-http.observability.svc:8220"
    insecure: true
    preset: perNode
    tokenFromSecret:
      name: elastic-agent-token
      key: token
  presets:
    perNode:
      resources:
        limits:
          memory: 2000Mi
        requests:
          cpu: 100m
          memory: 400Mi

system:
  enabled: true
