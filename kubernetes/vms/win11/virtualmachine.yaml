---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win11
  namespace: vms
  labels:
    app: win11-desktop
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        kubevirt.io/vm: win11
        app: win11-desktop
    spec:
      nodeSelector:
        kubernetes.io/hostname: workstation
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 1800
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 1800
      terminationGracePeriodSeconds: 300
      domain:
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: true
              persistent: true
        cpu:
          sockets: 1
          cores: 4
          threads: 1
          model: host-passthrough
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 8Gi
        features:
          acpi: {}
          apic: {}
          smm:
            enabled: true
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            reset: {}
            runtime: {}
            tlbflush: {}
            ipi: {}
            vpindex: {}
        clock:
          timezone: "America/New_York"
          timer:
            hpet:
              present: false
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
            hyperv: {}
        devices:
          tpm:
            persistent: true
          blockMultiQueue: true
          inputs:
            - type: tablet
              bus: usb
              name: tablet
          disks:
            - name: boot-disk
              disk:
                bus: virtio
              bootOrder: 1
            - name: sysprep-disk
              cdrom:
                bus: sata
            - name: virtio-drivers
              cdrom:
                bus: sata
          interfaces:
            - name: lab-lan
              binding:
                name: managedtap
          rng: {}
      networks:
        - name: lab-lan
          multus:
            networkName: ovn-ad-vpc
      volumes:
        - name: boot-disk
          persistentVolumeClaim:
            claimName: win11-boot-pvc
        - name: sysprep-disk
          sysprep:
            secret:
              name: win11-unattend-secret
        - name: virtio-drivers
          persistentVolumeClaim:
            claimName: nas-isos-virtio-pvc
