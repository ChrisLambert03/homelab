---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sql01-auth
  namespace: vms
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sql01-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MSSQL_SA_PASSWORD: "{{ .sql01_sa_password }}"
  data:
    - secretKey: sql01_sa_password
      remoteRef:
        key: secret/data/homelab
        property: sql01_sa_password
