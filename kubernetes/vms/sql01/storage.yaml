---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sql01-iscsi-pv
spec:
  claimRef:
    namespace: vms
    name: sql01-data-pvc
  capacity:
    storage: 50G
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  iscsi:
    targetPortal: 10.0.0.60:3260
    iqn: iqn.2026-11.us.lambertlab:sql01-data
    lun: 0
    fsType: ext4
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql01-data-pvc
  namespace: vms
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: sql01-iscsi-pv
  resources:
    requests:
      storage: 50G
  storageClassName: ""
