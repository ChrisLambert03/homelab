---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sql01
  namespace: vms
  labels:
    app: sql01
spec:
  serviceName: sql01
  replicas: 1
  selector:
    matchLabels:
      app: sql01
  template:
    metadata:
      labels:
        app: sql01
      annotations:
        k8s.v1.cni.cncf.io/networks: vms/ovn-ad-vpc
        ovn-ad-vpc.vms.ovn.kubernetes.io/ip_address: 10.10.0.19
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: mssql
              containerPort: 1433
              protocol: TCP
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_AGENT_ENABLED
              value: "true"
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "3072"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql01-auth
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
      volumes:
        - name: mssql-data
          persistentVolumeClaim:
            claimName: sql01-data-pvc
