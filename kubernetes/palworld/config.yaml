---
# Palworld ConfigMap
# Non-sensitive server settings, schedules, and performance flags.
apiVersion: v1
kind: ConfigMap
metadata:
  name: palworld-config
  namespace: gaming
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/New_York"
  PORT: "8211"
  PLAYERS: "16"
  SERVER_NAME: "LambertLab Palworld"
  SERVER_DESCRIPTION: "Dedicated Palworld Server"
  COMMUNITY: "false"
  CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"

  # --- Performance & Multi-Threading ---
  ENABLE_PERF_THREADING_ARGS: "true"

  # --- Admin & Management ---
  RCON_ENABLED: "true"
  RCON_PORT: "25575"
  REST_API_ENABLED: "true"
  REST_API_PORT: "8212"

  # --- Automatic Backups & Bounded Retention ---
  BACKUP_ENABLED: "true"
  BACKUP_CRON_EXPRESSION: "0 */4 * * *"
  DELETE_OLD_BACKUPS: "true"
  OLD_BACKUP_DAYS: "3"

  # --- Auto-Update & Daily Reboot (5:00 AM ET) ---
  AUTO_UPDATE_ENABLED: "true"
  AUTO_UPDATE_CRON_EXPRESSION: "30 4 * * *"
  AUTO_REBOOT_ENABLED: "true"
  AUTO_REBOOT_CRON_EXPRESSION: "0 5 * * *"
  AUTO_REBOOT_WARN_MINUTES: "5"
  AUTO_REBOOT_EVEN_IF_PLAYERS_ONLINE: "true"
