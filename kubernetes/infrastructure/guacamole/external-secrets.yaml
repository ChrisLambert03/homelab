---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole-ldap-auth
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: guacamole-ldap-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        bind-password: "{{ .ad_svc_guacamole_password }}"
  data:
    - secretKey: ad_svc_guacamole_password
      remoteRef:
        key: secret/data/homelab
        property: ad_svc_guacamole_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole-postgresql-auth
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: guacamole-postgresql-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .guacamole_postgres_password }}"
        user-password: "{{ .guacamole_user_password }}"
  data:
    - secretKey: guacamole_postgres_password
      remoteRef:
        key: secret/data/homelab
        property: guacamole_postgres_password
    - secretKey: guacamole_user_password
      remoteRef:
        key: secret/data/homelab
        property: guacamole_user_password
