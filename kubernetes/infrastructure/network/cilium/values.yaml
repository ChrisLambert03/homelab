---
# Cilium Helm Values (eBPF Kube-Proxy Replacement & Multus Chaining)
cni:
  exclusive: false

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  tls:
    auto:
      method: cronJob

ipam:
  mode: kubernetes

k8sServiceHost: "10.0.0.201"
k8sServicePort: 6443
kubeProxyReplacement: true

l2announcements:
  enabled: true

k8s:
  requireIPv4PodCIDR: true
