---
# Match vanilla kubeadm control-plane labels so ovn-central can schedule
masterNodesLabels:
  kube-ovn/role: master
  node-role.kubernetes.io/control-plane: ""

# Explicit master node IPs for 3-node HA Raft clustering (required for ArgoCD client-side rendering)
masterNodes:
  - "10.0.0.11"
  - "10.0.0.12"
  - "10.0.0.13"

networking:
  # Move the internal Join Subnet away from 100.64.0.0/16
  # This prevents Kube-OVN from breaking your Tailscale connection (which uses 100.64.0.0/10)
  join:
    cidr:
      v4: "172.18.0.0/16"

cni:
  # Tell Kube-OVN to run exclusively as a secondary network (Multus).
  # This prevents it from hijacking Cilium, which runs your default Kubernetes pods.
  nonPrimaryCNI: true
