---
# ==============================================================================
# Cross-Node Multicast VXLAN Overlay (br-lab0)
# ==============================================================================
# NOTE: NMState Safety Lifecycle:
# Deleting this file or the NNCP manifests will NOT delete the interfaces from
# the Linux OS nodes. To decommission an interface, you must explicitly set
# 'state: absent' under desiredState first, allow NMState to remove it from the
# OS, and only then delete the policy CRDs.
# ==============================================================================

# 1. Lenovo ThinkCentre (eno1)
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: lab-lan-bridge-lenovo
spec:
  nodeSelector:
    kubernetes.io/hostname: lenovo
  maxUnavailable: 1
  desiredState:
    interfaces:
      - name: vxlan-lab
        type: vxlan
        state: up
        vxlan:
          id: 100
          remote: 239.1.1.1
          destination-port: 4789
          base-iface: eno1
      - name: br-lab0
        type: linux-bridge
        state: up
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: vxlan-lab
        ipv4:
          enabled: true
          address:
            - ip: 10.10.0.2
              prefix-length: 24
        ipv6:
          enabled: false
---
