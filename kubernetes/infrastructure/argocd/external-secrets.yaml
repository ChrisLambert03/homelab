---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      data:
        oidc.azure.clientSecret: "{{ .argocd_oidc_client_secret }}"
  data:
    - secretKey: argocd_oidc_client_secret
      remoteRef:
        key: secret/data/homelab
        property: argocd_oidc_client_secret
