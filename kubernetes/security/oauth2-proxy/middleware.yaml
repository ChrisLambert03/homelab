---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-auth
  namespace: security
spec:
  forwardAuth:
    address: http://oauth2-proxy.security.svc.cluster.local:80
    trustForwardHeader: true
    authSigninURL: "https://auth.lambertlab.us/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
