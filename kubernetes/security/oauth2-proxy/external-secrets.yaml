---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-auth
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: oauth2-proxy-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: "{{ .entra_oauth2_proxy_client_id }}"
        client-secret: "{{ .entra_oauth2_proxy_client_secret }}"
        cookie-secret: "{{ .entra_oauth2_proxy_cookie_secret }}"
  data:
    - secretKey: entra_oauth2_proxy_client_id
      remoteRef:
        key: secret/data/homelab
        property: entra_oauth2_proxy_client_id
    - secretKey: entra_oauth2_proxy_client_secret
      remoteRef:
        key: secret/data/homelab
        property: entra_oauth2_proxy_client_secret
    - secretKey: entra_oauth2_proxy_cookie_secret
      remoteRef:
        key: secret/data/homelab
        property: entra_oauth2_proxy_cookie_secret
