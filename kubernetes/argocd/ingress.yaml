---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.lambertlab.us`)
      priority: 10
      middlewares:
        - name: admin-only-access
          namespace: default
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.lambertlab.us`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      middlewares:
        - name: admin-only-access
          namespace: default
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-web
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argocd.lambertlab.us`)
      middlewares:
        - name: https-redirect
          namespace: default
      services:
        - name: argocd-server
          port: 80
